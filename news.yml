name: Daily NOVA news
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build news.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_news.py
      - name: Commit changes
        run: |
          git config user.name "nova-news-bot"
          git config user.email "nova-news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Daily news update" && git push)
